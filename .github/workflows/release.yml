name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.3)"
        required: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI installer and Portable ZIP
        run: ./gradlew :app:installerMsi :app:portableZip --no-daemon

      - name: Build Inno Setup installer (-setup.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes
          }
          $ver = if ("${{ inputs.version }}" -ne "") { "${{ inputs.version }}" } else {
            (Select-String -Path "app/build.gradle.kts" -Pattern 'val desktopVersion = "([^"]+)"').Matches.Groups[1].Value
          }
          & $iscc "/DAppVersion=$ver" "tools\installer\cloudstream.iss"

      - name: Print SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem "dist/release/*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            Write-Host "$($_.Name)  SHA256: $hash"
          }

      - name: Upload release installers
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-Release
          path: |
            dist/release/*.exe
            dist/release/*.msi
            dist/release/*.zip
