<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="CloudStream for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#101C3A"/>
      <stop offset="1" stop-color="#1B2D5E"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC4FF"/>
      <stop offset="1" stop-color="#3B7BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#3B7BFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#26A5E4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#26A5E4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="380" rx="28" fill="url(#glow2)"/>

  <!-- film-strip dots along the bottom -->
  <g fill="#FFFFFF" opacity="0.07">
    <rect x="48" y="338" width="22" height="12" rx="3"/><rect x="88" y="338" width="22" height="12" rx="3"/><rect x="128" y="338" width="22" height="12" rx="3"/>
    <rect x="168" y="338" width="22" height="12" rx="3"/><rect x="208" y="338" width="22" height="12" rx="3"/><rect x="248" y="338" width="22" height="12" rx="3"/>
    <rect x="288" y="338" width="22" height="12" rx="3"/><rect x="328" y="338" width="22" height="12" rx="3"/><rect x="368" y="338" width="22" height="12" rx="3"/>
    <rect x="408" y="338" width="22" height="12" rx="3"/><rect x="448" y="338" width="22" height="12" rx="3"/><rect x="488" y="338" width="22" height="12" rx="3"/>
    <rect x="528" y="338" width="22" height="12" rx="3"/><rect x="568" y="338" width="22" height="12" rx="3"/><rect x="608" y="338" width="22" height="12" rx="3"/>
    <rect x="648" y="338" width="22" height="12" rx="3"/><rect x="688" y="338" width="22" height="12" rx="3"/><rect x="728" y="338" width="22" height="12" rx="3"/>
    <rect x="768" y="338" width="22" height="12" rx="3"/><rect x="808" y="338" width="22" height="12" rx="3"/><rect x="848" y="338" width="22" height="12" rx="3"/>
    <rect x="888" y="338" width="22" height="12" rx="3"/><rect x="928" y="338" width="22" height="12" rx="3"/><rect x="968" y="338" width="22" height="12" rx="3"/>
    <rect x="1008" y="338" width="22" height="12" rx="3"/><rect x="1048" y="338" width="22" height="12" rx="3"/><rect x="1088" y="338" width="22" height="12" rx="3"/>
    <rect x="1128" y="338" width="22" height="12" rx="3"/><rect x="1168" y="338" width="22" height="12" rx="3"/><rect x="1208" y="338" width="22" height="12" rx="3"/>
  </g>

  <!-- logo: cloud with a play button -->
  <g transform="translate(86 78)" filter="url(#soft)">
    <path d="M52 168 C22 168 6 144 10 118 C14 96 32 84 52 86 C58 52 86 32 120 36 C152 40 172 62 176 90 C204 90 224 110 222 134 C220 156 202 168 178 168 Z" fill="url(#cloud)"/>
    <path d="M96 78 L96 150 L152 114 Z" fill="#FFFFFF"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI Variable Display','Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif">
    <text x="360" y="150" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="-1">CloudStream</text>
    <text x="360" y="214" font-size="46" font-weight="600" fill="#9FC6FF">for Windows</text>
    <text x="362" y="262" font-size="24" fill="#C9D6F2">Movies, series, anime and live TV in a native Windows 11 app.</text>
    <text x="362" y="296" font-size="20" fill="#8CA0CC">Free · Open source · Works with every CloudStream extension</text>
  </g>

  <!-- chips -->
  <g font-family="'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">
    <rect x="1010" y="64" width="190" height="44" rx="22" fill="#26A5E4"/>
    <text x="1105" y="93" text-anchor="middle" fill="#FFFFFF">t.me/cs3d_official</text>
    <rect x="1010" y="122" width="190" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="1105" y="151" text-anchor="middle" fill="#FFFFFF">Donate · Razorpay</text>
  </g>
</svg>
